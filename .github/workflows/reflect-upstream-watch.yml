name: Reflect — upstream watch

# Weekly: if upstream has published a release newer than .reflect/upstream.lock,
# merge that tag to a branch and open a PR bumping the lock. Merging the PR is
# the decision to ship; reflect-deploy.yml then asks for one more approval.
#
# We track TAGS, never upstream main. Upstream shipped 18 releases in the 75 days
# to 2026-08-19 — about 1.7 a week, not the "two or three" this comment used to
# claim — and every tag carries a release-notes/vX.Y.Z.md file, so the review
# diff contains its own changelog.
#
# WHY WEEKLY, not nightly. Only the newest release is ever fetched, and the lock
# moves only when a PR merges. Run nightly while reviewing weekly and each new
# release opens its own branch and PR, so the earlier ones sit there superseded
# and have to be closed by hand. Running weekly collapses whatever landed that
# week into one PR aimed at the newest tag, which is the same thing you would
# have ended up merging.
#
# The trade is a coarser bisect: if a batch of three releases breaks something,
# the deploy no longer tells you which one did it. Accepted deliberately —
# this is an internal tool behind Access, so being a few days behind upstream
# costs nothing, while an unreviewed deploy costs an evening.
#
# Checkout and push prefer REFLECT_SYNC_TOKEN, a fine-grained PAT, over the
# default GITHUB_TOKEN. Events raised by GITHUB_TOKEN do not start new workflow
# runs, so upstream's own ci.yml would never run on the sync PR and you would be
# approving a release nothing had tested. Without the PAT this still works, it
# just loses that check — reflect-deploy re-runs the tests and the build before
# it migrates, so a broken release cannot reach production either way.
#
# Upstream release text and migration SQL are UNTRUSTED input. They reach the
# shell only as environment variables or files, never through `${{ }}`
# interpolation into a command line — a backtick in someone else's changelog
# would otherwise run as command substitution on our runner.

on:
  schedule:
    # Monday 11:00 UTC — 04:00 PDT in summer, 03:00 PST in winter. GitHub cron
    # has no timezone, so the hour drifts by one with DST rather than the day.
    # reflect-sync-nudge posts at 16:00 UTC the same morning, so the PR is
    # already open and its checks have run by the time it lands in Chat.
    - cron: "0 11 * * 1"
  workflow_dispatch:

# Needed for the GITHUB_TOKEN fallback path: without a PAT the job pushes the
# sync branch and opens the PR as github-actions[bot], and `contents: read`
# fails that push with a 403 only after the merge has already succeeded. A PAT
# carries its own permissions and ignores these.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reflect-upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    # Keeps this file inert if it is ever synced to another fork.
    if: contains(fromJSON('["sebastian-reflectmedia/open-seo", "GetOn-Reflect-Next/open-seo"]'), github.repository)
    runs-on: ubuntu-latest
    # The `secrets` context is not available in a step-level `if`, so collapse it
    # to a plain string here and branch on that instead.
    env:
      HAS_PAT: ${{ secrets.REFLECT_SYNC_TOKEN != '' }}
    steps:
      # Falls back to GITHUB_TOKEN so the watch still works before a PAT exists.
      # The fallback costs the CI gate: events raised by GITHUB_TOKEN do not
      # start new workflow runs, so upstream's ci.yml will NOT run on the sync
      # PR. reflect-deploy re-runs the tests and the build before it migrates,
      # so a broken release still cannot reach production — but you would be
      # approving a PR that nothing had tested. Add REFLECT_SYNC_TOKEN to get
      # the check back.
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REFLECT_SYNC_TOKEN || github.token }}

      - name: Warn when running without a PAT
        if: env.HAS_PAT != 'true'
        run: |
          echo "::warning::REFLECT_SYNC_TOKEN is not set. The sync PR will be opened with" \
               "GITHUB_TOKEN, so upstream's ci.yml will not run on it. reflect-deploy still" \
               "runs tests and the build before migrating."

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/every-app/open-seo.git
          git fetch upstream --tags --quiet

      - name: Resolve current and latest release
        id: rel
        env:
          GH_TOKEN: ${{ secrets.REFLECT_SYNC_TOKEN || github.token }}
        run: |
          set -euo pipefail
          current=$(jq -r .tag .reflect/upstream.lock)
          latest=$(gh api repos/every-app/open-seo/releases/latest --jq .tag_name)

          # Tag names are used to build branch names and git refs. Constrain them
          # before they reach any command line.
          case "$latest" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::unexpected upstream tag format: $latest"; exit 1 ;;
          esac

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest"   >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "Already on $current — nothing to do."
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "Upstream released $latest; we are on $current."
          fi

      - name: Verify the tag resolves
        if: steps.rel.outputs.up_to_date == 'false'
        env:
          NEW_TAG: ${{ steps.rel.outputs.latest }}
        run: |
          set -euo pipefail
          git rev-parse -q --verify "refs/tags/${NEW_TAG}^{commit}" >/dev/null \
            || { echo "::error::tag ${NEW_TAG} not found after fetch"; exit 1; }

      - name: Scan new migrations for destructive SQL
        if: steps.rel.outputs.up_to_date == 'false'
        id: migrations
        env:
          CUR_TAG: ${{ steps.rel.outputs.current }}
          NEW_TAG: ${{ steps.rel.outputs.latest }}
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=A "$CUR_TAG" "$NEW_TAG" -- 'drizzle/*.sql' \
            > /tmp/added-migrations.txt || true

          : > /tmp/destructive.md
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if git show "${NEW_TAG}:${f}" | grep -qiE 'DROP[[:space:]]+(TABLE|COLUMN)'; then
              {
                printf '\n- `%s`\n\n```sql\n' "$f"
                git show "${NEW_TAG}:${f}" | grep -iE 'DROP[[:space:]]+(TABLE|COLUMN)'
                printf '```\n'
              } >> /tmp/destructive.md
            fi
          done < /tmp/added-migrations.txt

          if [ -s /tmp/destructive.md ]; then
            echo "has_destructive=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_destructive=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge the release and bump the lock
        if: steps.rel.outputs.up_to_date == 'false'
        id: branch
        env:
          CUR_TAG: ${{ steps.rel.outputs.current }}
          NEW_TAG: ${{ steps.rel.outputs.latest }}
        run: |
          set -euo pipefail
          branch="reflect/upstream-${NEW_TAG}"
          git config user.name  "reflect-upstream-bot"
          git config user.email "sebastian@reflectmedia.ca"
          git checkout -b "$branch"

          # The merge below is only conflict-free while the tag we are already
          # on is genuinely in main's history. Squash-merging one of these PRs
          # breaks that: the release's content lands as a single commit with no
          # link to the tag, so the NEXT merge replays everything since the last
          # tag that IS an ancestor and collides on every file both releases
          # touched. That is exactly what happened to v0.1.6 (run 32363000155).
          #
          # Record the missing ancestry with a tree-preserving merge before
          # doing the real one. `-s ours` keeps our tree byte for byte and only
          # adds the parent edge, which is the part the squash threw away.
          if ! git merge-base --is-ancestor "$CUR_TAG" HEAD; then
            echo "::warning::${CUR_TAG} is not in main's history — a previous sync PR was" \
                 "squash-merged. Recording the ancestry so this merge stays clean."
            git merge -s ours --no-edit -m \
              "chore(reflect): record ${CUR_TAG} ancestry (lost to a squash merge)" "$CUR_TAG"
          fi

          # New paths only (.reflect/, .github/workflows/reflect-*.yml, scripts/reflect-*)
          # and wrangler.jsonc is never edited in git, so this merge cannot
          # conflict. If it ever does, stop — do not auto-resolve someone
          # else's release.
          if ! git merge --no-edit "$NEW_TAG"; then
            echo "::error::merge conflict against ${NEW_TAG} — resolve by hand, then rerun"
            git merge --abort || true
            exit 1
          fi

          jq --arg t "$NEW_TAG" '.tag = $t' .reflect/upstream.lock > /tmp/lock.json
          mv /tmp/lock.json .reflect/upstream.lock
          git add .reflect/upstream.lock
          git commit -m "chore(reflect): track upstream ${NEW_TAG}"
          # A 403 here means REFLECT_SYNC_TOKEN can read the repo but not write it.
          # Upstream releases also edit .github/workflows/, which GitHub refuses
          # without the Workflows permission, so the token needs all three.
          if ! git push --force-with-lease origin "$branch"; then
            echo "::error::push refused. REFLECT_SYNC_TOKEN needs Contents, Pull requests" \
                 "and Workflows read/write on ${GITHUB_REPOSITORY}. Re-issue it, then rerun."
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Decides whether this release may ship without a human. Runs after the
      # merge so the classifier sees the branch exactly as it will be deployed.
      - name: Classify the release for unattended shipping
        if: steps.rel.outputs.up_to_date == 'false'
        id: risk
        env:
          CUR_TAG: ${{ steps.rel.outputs.current }}
          NEW_TAG: ${{ steps.rel.outputs.latest }}
        run: |
          set -euo pipefail
          node scripts/reflect-classify-migrations.mjs --self-test
          node scripts/reflect-classify-migrations.mjs --base "$CUR_TAG" --head "$NEW_TAG"

      - name: Open or update the PR
        if: steps.rel.outputs.up_to_date == 'false'
        env:
          GH_TOKEN: ${{ secrets.REFLECT_SYNC_TOKEN || github.token }}
          CUR_TAG: ${{ steps.rel.outputs.current }}
          NEW_TAG: ${{ steps.rel.outputs.latest }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          HAS_DESTRUCTIVE: ${{ steps.migrations.outputs.has_destructive }}
          RISK: ${{ steps.risk.outputs.class }}
          AUTO_SHIP_ENABLED: ${{ vars.REFLECT_AUTO_SHIP }}
        run: |
          set -euo pipefail

          {
            printf 'Tracks upstream release **%s** (was `%s`).\n\n' "$NEW_TAG" "$CUR_TAG"
            printf 'Upstream changelog: `release-notes/%s.md` in this diff.\n' "$NEW_TAG"
            printf 'Compare: https://github.com/every-app/open-seo/compare/%s...%s\n\n' \
              "$CUR_TAG" "$NEW_TAG"
            printf '### New migrations\n\n```\n'
            if [ -s /tmp/added-migrations.txt ]; then cat /tmp/added-migrations.txt; else echo "(none)"; fi
            printf '```\n'
          } > /tmp/pr-body.md

          if [ "$HAS_DESTRUCTIVE" = "true" ]; then
            {
              printf '\n### :warning: Destructive migrations in this release\n'
              cat /tmp/destructive.md
              printf '\nMerging this PR runs these against production D1. Read the SQL, then add\n'
              printf 'the `migration-reviewed` label — `reflect-migration-gate` blocks the merge\n'
              printf 'until you do. The deploy captures a Time Travel bookmark and a full export\n'
              printf 'first, but restoring is still an outage.\n'
            } >> /tmp/pr-body.md
          fi

          {
            printf '\n### Migration risk: `%s`\n\n' "$RISK"
            case "$RISK" in
              none|additive)
                printf 'Nothing in this release rewrites existing data, so `wrangler rollback`\n'
                printf 'is a complete undo.\n\n'
                if [ "${AUTO_SHIP_ENABLED:-}" = "true" ]; then
                  printf '`reflect-auto-ship` merges this once CI is green and the deploy runs\n'
                  printf 'unattended. Remove the `auto-ship` label to take it back under review.\n'
                else
                  printf 'Unattended shipping is switched off (`REFLECT_AUTO_SHIP` is not `true`),\n'
                  printf 'so this still waits for a merge and for environment approval.\n'
                fi
                ;;
              *)
                printf 'This release runs migrations against existing tables, which cannot be\n'
                printf 'un-run — rolling the Worker back would leave the schema ahead of the\n'
                printf 'code. Merging is a human decision and the deploy waits for environment\n'
                printf 'approval.\n'
                ;;
            esac
          } >> /tmp/pr-body.md

          {
            printf '\n---\nOpened by `reflect-upstream-watch`. Merging triggers `reflect-deploy`.\n'
          } >> /tmp/pr-body.md

          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "chore(reflect): upstream ${NEW_TAG}" --body-file /tmp/pr-body.md
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(reflect): upstream ${NEW_TAG}" --body-file /tmp/pr-body.md
          fi

          if [ "$HAS_DESTRUCTIVE" = "true" ]; then
            gh pr edit "$BRANCH" --add-label "destructive-migration" \
              || echo "::warning::could not add label 'destructive-migration' — create it on the repo"
          fi

          # The label is what reflect-auto-ship acts on, so it is only ever
          # added for a release the classifier cleared. Removing it by hand is
          # the way to stop a release from shipping unattended. Not applied at
          # all while the feature is switched off, so the label never implies
          # something that will not happen.
          case "$RISK" in
            none|additive)
              if [ "${AUTO_SHIP_ENABLED:-}" = "true" ]; then
                gh pr edit "$BRANCH" --add-label "auto-ship" \
                  || echo "::warning::could not add label 'auto-ship' — create it on the repo"
              else
                echo "Classified ${RISK}, but REFLECT_AUTO_SHIP is not 'true' — leaving this for review."
              fi
              ;;
          esac
